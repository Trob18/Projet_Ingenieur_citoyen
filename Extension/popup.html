<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #f7f7f8;
      color: #1a1a1a;
    }

    header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e0e0e0;
    }

    header h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .icon {
      width: 20px;
      height: 20px;
      background: #2563eb;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .field {
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    input[type="url"],
    input[type="number"] {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #fff;
      font-size: 13px;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="url"]:focus,
    input[type="number"]:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }

    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      align-items: flex-end;
    }

    .row .field { margin-bottom: 0; flex: 1; }

    button {
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    #btnExtract {
      background: #2563eb;
      color: #fff;
      margin-bottom: 12px;
    }

    #btnExtract:hover:not(:disabled) { background: #1d4ed8; }

    #btnExtract:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #status {
      font-size: 11px;
      color: #6b7280;
      min-height: 16px;
      margin: -8px 0 10px;
    }

    textarea {
      width: 100%;
      height: 130px;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #fff;
      font-size: 12px;
      font-family: "Menlo", "Consolas", monospace;
      color: #374151;
      resize: vertical;
      outline: none;
      margin-bottom: 10px;
    }

    .export-row {
      display: flex;
      gap: 8px;
    }

    .btn-secondary {
      flex: 1;
      background: #fff;
      border: 1px solid #d1d5db;
      color: #374151;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #f3f4f6;
    }
  </style>
</head>
<body>

  <header>
    <div class="icon"></div>
    <h1>Extracteur de Liens</h1>
  </header>

  <div class="row">
    <div class="field">
      <label for="inputUrl">URL cible</label>
      <input type="url" id="inputUrl" placeholder="https://exemple.com (ou onglet actif)">
    </div>
  </div>

  <button id="btnExtract">Récupérer les liens</button>

  <p id="status"></p>

  <textarea id="result" readonly placeholder="Les liens apparaîtront ici…"></textarea>

  <div class="export-row">
    <button id="btnCopy" class="btn-secondary">Copier</button>
    <button id="btnDownload" class="btn-secondary">Télécharger .txt</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
